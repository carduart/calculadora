<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Arbitraje</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .inputs-principales {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 720px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            border: 1px solid #333;
        }

        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #252525;
            color: #fff;
            box-sizing: border-box;
        }

        /* Estilo para el indicador de estado del BCV */
        .status-bcv {
            grid-column: 1 / -1;
            font-size: 11px;
            color: #f1c40f;
            margin-top: -5px;
            text-align: right;
        }

        .contenedor-cards {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            flex: 1;
            min-width: 300px;
            border: 1px solid #333;
        }

        h2 { margin-top: 0; font-size: 1.2em; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .virtual-title { color: #f1c40f; }
        .debito-title { color: #3498db; }

        .linea { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
        .comision { color: #ff5555; }
        .subtotal { font-weight: bold; color: #fff; border-top: 1px solid #333; padding-top: 5px; }

        .ganancia-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .positivo { background: rgba(0, 255, 127, 0.1); color: #00ff7f; border: 1px solid #00ff7f; }
        .negativo { background: rgba(255, 85, 85, 0.1); color: #ff5555; border: 1px solid #ff5555; }
    </style>
</head>
<body>

    <h1>Calculadora de Arbitraje</h1>

    <!-- Entradas compartidas -->
    <div class="inputs-principales">
        <div class="input-group">
            <label>Monto inicial (USDT)</label>
            <input type="number" id="monto" value="1000" oninput="calcular()">
        </div>
        <div class="input-group">
            <label>Tasa Venta Binance (Bs)</label>
            <input type="number" id="tasaBs" value="730" step="0.01" oninput="calcular()">
        </div>
        <div class="input-group">
            <label>Tasa Compra (USD)</label>
            <input type="number" id="tasaUsd" value="615.52" step="0.01" oninput="calcular()">
        </div>
        <!-- Texto informativo del estado del BCV -->
        <div id="bcvStatus" class="status-bcv">Consultando tasa oficial BCV...</div>
    </div>

    <div class="contenedor-cards">
        <!-- SECCIÓN VIRTUAL -->
        <div class="card">
            <h2 class="virtual-title">BDV Virtual</h2>
            <div id="res-virtual"></div>
        </div>

        <!-- SECCIÓN DÉBITO -->
        <div class="card">
            <h2 class="debito-title">BDV Débito</h2>
            <div id="res-debito"></div>
        </div>
    </div>

    <script>
        // Función para consultar el BCV y actualizar la Tasa Compra (USD) con el +0.50%
        async function obtenerTasaBCV() {
            const statusLabel = document.getElementById('bcvStatus');
            try {
                // Petición a la API pública con las tasas actualizadas de Venezuela
                const respuesta = await fetch('https://ve.descubra.me/api/v1/rates');
                const datos = await respuesta.json();
                
                if(datos && datos.bcv) {
                    const tasaOficialBCV = parseFloat(datos.bcv);
                    
                    // Calculamos el costo real de adquisición en el BDV (Tasa BCV + 0.50%)
                    const tasaCompraConComision = tasaOficialBCV * 1.005;
                    
                    // Asignamos automáticamente el resultado al input de Tasa Compra (USD)
                    document.getElementById('tasaUsd').value = tasaCompraConComision.toFixed(2);
                    
                    // Mostramos la información de éxito en el estado del panel
                    statusLabel.innerText = `🟢 BCV Oficial: ${tasaOficialBCV.toFixed(2)} Bs | Tasa Compra USD Auto (+0.50%): ${tasaCompraConComision.toFixed(2)} Bs`;
                    
                    // Volvemos a ejecutar los cálculos globales de las tarjetas
                    calcular();
                } else {
                    statusLabel.innerText = "⚠️ No se reconoció el formato de la tasa. Usando valores manuales.";
                }
            } catch (error) {
                console.error("Error al obtener la tasa del BCV:", error);
                statusLabel.innerText = "❌ No se pudo conectar con el BCV. Usando valores manuales.";
            }
        }

        function calcular() {
            const monto = parseFloat(document.getElementById('monto').value) || 0;
            const tasaBs = parseFloat(document.getElementById('tasaBs').value) || 0;
            const tasaUsd = parseFloat(document.getElementById('tasaUsd').value) || 0;

            // Procesar ambos tipos
            actualizarSeccion('res-virtual', monto, tasaBs, tasaUsd, 0.025); // 2.5%
            actualizarSeccion('res-debito', monto, tasaBs, tasaUsd, 0.015);  // 1.5%
        }

        function actualizarSeccion(idContenedor, monto, tasaBs, tasaUsd, comisionTasa) {
            // Cálculos
            const bsBrutos = monto * tasaBs;
            const comisionBDV = bsBrutos * 0.005;
            const bsNetos = bsBrutos - comisionBDV;
            const usdDisp = bsNetos / tasaUsd;
            const comisionT = usdDisp * comisionTasa;
            const usdTrasT = usdDisp - comisionT;
            const comisionBPay = usdTrasT * 0.036;
            const usdFinales = usdTrasT - comisionBPay;
            const ganancia = usdFinales - monto;

            const claseGanancia = ganancia >= 0 ? 'positivo' : 'negativo';

            // Dibujar los resultados en el HTML
            document.getElementById(idContenedor).innerHTML = `
                <div class="linea"><span>Brutos:</span> <span>${bsBrutos.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} Bs</span></div>
                <div class="linea comision"><span>Comisión BDV (0.5%):</span> <span>-${comisionBDV.toFixed(2)} Bs</span></div>
                <div class="linea subtotal"><span>Bs Netos:</span> <span>${bsNetos.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} Bs</span></div>
                <div class="linea"><span>USD Disponibles:</span> <span>${usdDisp.toFixed(2)} $</span></div>
                <div class="linea comision"><span>Tarjeta (${(comisionTasa*100).toFixed(1)}%):</span> <span>-${comisionT.toFixed(2)} $</span></div>
                <div class="linea"><span>Tras Tarjeta:</span> <span>${usdTrasT.toFixed(2)} $</span></div>
                <div class="linea comision"><span>BPay (3.6%):</span> <span>-${comisionBPay.toFixed(2)} $</span></div>
                
                <div class="ganancia-box ${claseGanancia}">
                    Ganancia: ${ganancia >= 0 ? '+' : ''}${ganancia.toFixed(2)} USDT
                    <div style="font-size: 0.8em; margin-top:5px;">Total: ${usdFinales.toFixed(2)} USDT</div>
                </div>
            `;
        }

        // Ejecutar los cálculos estáticos iniciales
        calcular();
        
        // Consultar la API del BCV en tiempo real en segundo plano
        obtenerTasaBCV();
    </script>
</body>
</html>
